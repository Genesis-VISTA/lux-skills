# Mistral-7B-v0.3 (7.2B dense, ungated). Dimensions from the HF config.json.
# Same shape as models/mistral_large_2411.yaml in the reference package: a
# Llama-style decoder with GQA, so reuse llama_base and override.
# Installed into primus/configs/models/megatron/ by job.lux.slurm (it has no top-level `modules:`).
extends:
  - llama_base.yaml

tokenizer_type: HuggingFaceTokenizer
tokenizer_model: mistralai/Mistral-7B-v0.3

group_query_attention: true
num_query_groups: 8

hidden_size: 4096
ffn_hidden_size: 14336
num_layers: 32
num_attention_heads: 32
kv_channels: 128

max_position_embeddings: 32768
rotary_base: 1000000
norm_epsilon: 1.0e-05
init_method_std: 0.02

# Mistral does not scale rope; llama_base sets a factor of 40, so disable it.
rotary_scaling_factor: null

apply_rope_fusion: true
masked_softmax_fusion: false
